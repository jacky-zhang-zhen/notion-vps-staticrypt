<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protected document</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f5f7fb;
    }
    .gate {
      width: min(440px, 100%);
      border: 1px solid #d8e0ea;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 42px rgba(15, 23, 42, 0.1);
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: #5d6978;
      font-size: 14px;
      line-height: 1.55;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #334155;
      font-weight: 650;
    }
    input {
      width: 100%;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }
    button {
      width: 100%;
      height: 44px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #b42318;
      font-size: 13px;
    }
  </style>
</head>

    <p>这个页面已加密。输入正确密码后，内容会在你的浏览器中本地解密显示。</p>
    <label for="password">查看密码</label>
    <input id="password" type="password" autocomplete="current-password" autofocus required>
    <button id="submit" type="submit">解锁文档</button>
    <div class="error" id="error" role="alert"></div>
  </form>

    function fromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password) {
      const encodedPassword = new TextEncoder().encode(password);
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encodedPassword,
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromBase64(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(password) {
      const key = await deriveKey(password);
      const encrypted = fromBase64(payload.data);
      const authTag = fromBase64(payload.authTag);
      const combined = new Uint8Array(encrypted.length + authTag.length);
      combined.set(encrypted, 0);
      combined.set(authTag, encrypted.length);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(payload.iv), tagLength: 128 },
        key,
        combined
      );
      return new TextDecoder().decode(decrypted);
    }

    document.getElementById("gate").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("password");
      const button = document.getElementById("submit");
      const error = document.getElementById("error");
      button.disabled = true;
      error.textContent = "";
      try {
        const html = await decrypt(input.value);
        document.open();
        document.write(html);
        document.close();
      } catch {
        error.textContent = "密码不正确，或文件已损坏。";
        button.disabled = false;
        input.select();
      }
    });
